<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Missão KBD • Aula</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05070f">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/favicon-32.png">
  <link rel="stylesheet" href="style.css?v=20260804-3">
  <script defer src="quizzes.js?v=20260804-2"></script>
  <script defer src="app.js?v=20260804-3"></script>
</head>
<body onload="renderKbd()">
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="app-shell">

    <header class="topbar topbar-minimal">
      <div class="topbar-left">
        <button id="topbarBack" class="icon-button" type="button" aria-label="Voltar"></button>
      </div>
      <div class="topbar-right">
        <span id="topbarSetor" class="setor-badge">—</span>
      </div>
    </header>

    <main class="main-content">

      <section class="summary-card" style="margin:16px 16px 0;">
        <div class="summary-card-top">
          <div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
              <span id="kbdStatusBadge" class="status-badge">Quiz pendente</span>
          <span id="kbdStatusPill" class="status-badge">—</span>
            </div>
            <div id="kbdTitle" class="section-title" style="margin-top:8px;font-size:17px;">—</div>
            <p id="kbdSubtitle" class="helper-text" style="margin-top:2px;">—</p>
          </div>
          <div class="summary-card-icon">
            <svg viewBox="0 0 24 24"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="m17 10 5-3v10l-5-3z"/></svg>
          </div>
        </div>
        <div class="progress-track">
          <div id="kbdTrack" class="progress-fill" style="width:0%"></div>
        </div>
        <p id="kbdProgressCopy" class="helper-text">0/0 KBDs respondidos</p>
      </section>

      <div style="height:16px;"></div>

      <div id="pilulaKbd" class="pilula-card hidden"></div>

      <div style="height:12px;"></div>

      <div class="card content-stack" style="gap:16px;">
        <div class="section-head" style="padding:0;">
          <h2 class="section-title" style="font-size:17px;">Referências visuais</h2>
          <p class="section-subtitle">Imagens de execução, fotos de layout e materiais do KBD.</p>
        </div>
        <div id="imagensKbd" class="image-gallery"></div>
      </div>

      <div style="height:12px;"></div>

      <div class="card content-stack" style="gap:16px;">
        <div class="section-head" style="padding:0;">
          <h2 class="section-title" style="font-size:17px;">Vídeo</h2>
          <p class="section-subtitle">Treinamento em formato de aula para apoiar a execução em campo.</p>
        </div>
        <div class="media-frame">
          <div id="youtubePlayer" class="youtube-player hidden"></div>
          <video id="videoPlayer" class="hidden" controls playsinline preload="metadata"></video>
          <div id="videoPlaceholder" class="placeholder"></div>
        </div>
        <div id="videoProgressStatus" class="video-progress-status hidden"></div>
      </div>

      <button id="kbdQuizButton" class="primary-button" onclick="irParaQuiz()" style="margin:16px;width:calc(100% - 32px);">
        Responder o Quiz
      </button>

    </main>

    <nav id="bottomNav" class="bottom-nav"></nav>
  </div>
</body>
</html>

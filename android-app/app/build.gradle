plugins {
    id "com.android.application"
}

android {
    namespace "br.com.spotpromo.missaokbd"
    compileSdk 35

    defaultConfig {
        applicationId "br.com.spotpromo.missaokbd"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "2.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

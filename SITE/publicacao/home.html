<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Missão KBD • Home</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05070f">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/favicon-32.png">
  <link rel="stylesheet" href="style.css?v=20260805-1">
  <script defer src="quizzes.js?v=20260804-2"></script>
<script defer src="app.js?v=20260806-6"></script>
</head>
<body onload="renderHome()">
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="app-shell">

    <header class="topbar topbar-home-only">
      <div class="topbar-left">
        <img class="topbar-logo" src="assets/icon-192.png" alt="Missão KBD">
      </div>
      <div class="topbar-right topbar-right-home">
        <span id="topbarSetor" class="setor-badge">—</span>
      </div>
    </header>

    <main class="main-content">

      <section class="hero-card">
        <div class="hero-head">
          <span id="heroCiclo" class="hero-ciclo">Ciclo</span>
          <h1 class="hero-title">Treinamentos</h1>
          <p id="heroSummary" class="hero-subtitle">Carregando progresso...</p>
        </div>
        <div class="summary-card">
          <div class="summary-card-top">
            <div>
              <div class="summary-card-label">Progresso geral</div>
              <div id="heroStats" class="summary-card-value">0/0</div>
            </div>
            <div class="summary-card-icon">
              <svg viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M5 6H3a2 2 0 0 0 0 4h2"/><path d="M19 6h2a2 2 0 1 1 0 4h-2"/></svg>
            </div>
          </div>
          <div class="progress-track">
            <div id="heroTrack" class="progress-fill" style="width:0%"></div>
          </div>
        </div>
      </section>

      <section class="quick-actions">
        <a class="quick-action" href="novidades.html">
          <span class="quick-action-icon">
            <svg viewBox="0 0 24 24"><path d="M12 3v4"></path><path d="M12 17v4"></path><path d="M3 12h4"></path><path d="M17 12h4"></path><path d="m5.6 5.6 2.8 2.8"></path><path d="m15.6 15.6 2.8 2.8"></path><path d="m18.4 5.6-2.8 2.8"></path><path d="m8.4 15.6-2.8 2.8"></path></svg>
          </span>
          <span class="quick-action-title">Visão do ciclo</span>
          <span class="quick-action-sub">Novos, alterados e transformacionais</span>
        </a>
        <a class="quick-action tone-cyan" href="checklist.html">
          <span class="quick-action-icon">
            <svg viewBox="0 0 24 24"><path d="M9 6h11"></path><path d="M9 12h11"></path><path d="M9 18h11"></path><path d="M4 6h.01"></path><path d="M4 12h.01"></path><path d="M4 18h.01"></path></svg>
          </span>
          <span class="quick-action-title">Checklist de visita</span>
          <span class="quick-action-sub">Consulta rápida em loja</span>
        </a>
      </section>

      <section class="section-head">
        <h2 class="section-title">Conteúdos por categoria</h2>
      </section>

      <section id="listaMarcas" class="brand-list"></section>

    </main>

    <nav id="bottomNav" class="bottom-nav"></nav>
  </div>
</body>
</html>

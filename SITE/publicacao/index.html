<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Missão KBD • Login</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05070f">
  <meta name="app-build" content="20260806-3">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/favicon-32.png">
  <link rel="preload" href="assets/login-hero-final.webp?v=2" as="image" fetchpriority="high">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="prefetch" href="admin.html">
  <link rel="prefetch" href="admin-real.js?v=20260807-1" as="script">
  <link rel="prefetch" href="admin.css?v=20260806-2" as="style">
  <link rel="stylesheet" href="style.css?v=20260805-1">
<script defer src="app.js?v=20260806-6"></script>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <main class="login-page">
    <section class="login-panel">

      <div class="login-visual" role="img" aria-label="SPOT — Missão KBD: Execução de Elite, com o robô da missão"></div>

      <div class="login-head">
        <h1 class="login-title">Missão KBD</h1>
        <p class="login-subtitle">Informe suas credenciais para acessar a plataforma.</p>
      </div>

      <div class="form-stack">
        <label class="field-label" for="setor">Usuário ou setor</label>
        <input
          id="setor"
          class="input"
          type="text"
          placeholder="Ex.: RS234 ou SPI107"
          autocomplete="off"
          maxlength="24"
          spellcheck="false"
          autocapitalize="characters"
        >
      </div>

      <div class="form-stack">
        <label class="field-label" for="senha">Senha</label>
        <input
          id="senha"
          class="input"
          type="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
        >
      </div>

      <button id="loginButton" class="primary-button" onclick="entrar()">Entrar</button>

    </section>
  </main>
</body>
</html>

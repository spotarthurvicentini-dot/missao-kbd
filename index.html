<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Missão KBD • Login</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05070f">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/favicon-32.png">
  <link rel="preload" href="assets/login-hero-final.webp?v=2" as="image" fetchpriority="high">
  <link rel="stylesheet" href="style.css?v=20260804-6">
  <script defer src="app.js?v=20260804-6"></script>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <main class="login-page">
    <section class="login-panel">

      <div class="login-visual" role="img" aria-label="SPOT — Missão KBD: Execução de Elite, com o robô da missão"></div>

      <div class="login-head">
        <h1 class="login-title">Missão KBD</h1>
        <p class="login-subtitle">Insira seu código de setor para acessar os treinamentos.</p>
      </div>

      <div class="form-stack">
        <label class="field-label" for="setor">Código do setor</label>
        <input
          id="setor"
          class="input"
          type="text"
          placeholder="Ex.: RS234 ou SPI107"
          autocomplete="off"
          maxlength="24"
          spellcheck="false"
          autocapitalize="characters"
        >
      </div>

      <button class="primary-button" onclick="entrar()">Entrar</button>

    </section>
  </main>
</body>
</html>
